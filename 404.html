<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página no encontrada · Edrei</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080B12">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
<style>
  :root { --ink: #080b12; --paper: #eaf0fa; --mist: #9ba8c0; --cyan: #6bd3ff; --molten: #0ae98a; --line: #1c2537; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; background: var(--ink); color: var(--paper);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background-image: linear-gradient(rgba(107, 211, 255, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(107, 211, 255, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  main { max-width: 640px; display: grid; gap: 20px; padding-block: 48px; }
  .code { font: 500 0.75rem/1.4 "Martian Mono", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); }
  h1 { margin: 0; font-stretch: 125%; font-weight: 850; font-size: clamp(2.2rem, 8vw, 4.4rem); line-height: 0.95; text-transform: uppercase; text-wrap: balance; }
  h1 span { color: var(--molten); }
  p { margin: 0; color: var(--mist); font-size: 1.1rem; line-height: 1.55; }
  a.btn {
    justify-self: start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; margin-top: 8px;
    background: var(--molten); color: #03140b; font-weight: 650; text-decoration: none;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  a.btn:focus-visible { clip-path: none; outline: 2px solid var(--cyan); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404 · Pieza fuera de tolerancia</p>
  <h1>Esta página no está en el <span>plano</span>.</h1>
  <p>El enlace que seguiste no existe o cambió de lugar. Vuelve al inicio y sigue explorando lo que diseñamos, simulamos y fabricamos.</p>
  <a class="btn" href="./">Volver al inicio</a>
</main>
</body>
</html>
